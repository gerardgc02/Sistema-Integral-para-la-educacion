<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Materias - Dirección</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    select:focus { outline: none; border-color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .code-badge {
      font-family: monospace;
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: var(--accent);
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent); }
    .btn-del:hover { border-color: #ef4444; color: #ef4444; }

    .topbar-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Académico</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario Alta / Edición -->
      <div class="panel-card">
        <h2 id="form-title" style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Nueva Materia</h2>
        <form id="subject-crud-form">
          <input type="hidden" id="edit-index" value="-1">

          <div class="form-group">
            <label for="f-code">Clave de Asignatura</label>
            <input type="text" id="f-code" placeholder="Ej. DSP-402" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="f-name">Nombre de la Materia</label>
            <input type="text" id="f-name" placeholder="Ej. Procesamiento Digital de Señales" required>
          </div>

          <div class="form-group">
            <label for="f-credits">Créditos Académicos</label>
            <input type="number" id="f-credits" min="1" max="12" value="5" required>
          </div>

          <div class="form-group">
            <label for="f-semester">Semestre en Retícula</label>
            <select id="f-semester" required>
              <option value="1">1° Semestre</option>
              <option value="2">2° Semestre</option>
              <option value="3">3° Semestre</option>
              <option value="4">4° Semestre</option>
              <option value="5">5° Semestre</option>
              <option value="6" selected>6° Semestre</option>
              <option value="7">7° Semestre</option>
              <option value="8">8° Semestre</option>
            </select>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Guardar Materia</button>
          <button type="button" id="cancel-edit-btn" class="btn-sm" style="width: 100%; margin-top: 8px; display: none;">Cancelar Edición</button>
        </form>
      </div>

      <!-- Columna Derecha: Tabla de Materias Activas -->
      <div class="panel-card" style="overflow-x: auto;">
        <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Catálogo Institucional (Tabla `subjects`)</h2>
        <table>
          <thead>
            <tr>
              <th>Clave</th>
              <th>Asignatura</th>
              <th style="text-align: center;">Créditos</th>
              <th style="text-align: center;">Semestre</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="subjects-table-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // 0. Tema Oscuro / Claro
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    // 1. Guardia de Seguridad y Privilegios (Solo Nivel 3 o 4)
    const currentSession = requireAuth();
    if (currentSession.level < 3) {
      alert("Acceso denegado: Se requieren privilegios de Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Director" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    // 2. Persistencia local de la tabla `subjects` (sincronizada con seed.sql)
    const SUBJECTS_STORAGE_KEY = "rbac_db_subjects";

    const DEFAULT_SUBJECTS = [
      { code: "EMB-301", name: "Sistemas Embebidos", credits: 6, semester: 6 },
      { code: "ARQ-302", name: "Arquitectura de Computadoras", credits: 5, semester: 6 },
      { code: "RED-201", name: "Redes de Computadoras", credits: 5, semester: 6 },
      { code: "OS-401",  name: "Sistemas Operativos y Kernel", credits: 6, semester: 6 }
    ];

    function getSubjectsDB() {
      const stored = localStorage.getItem(SUBJECTS_STORAGE_KEY);
      if (!stored) {
        localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(DEFAULT_SUBJECTS));
        return DEFAULT_SUBJECTS;
      }
      return JSON.parse(stored);
    }

    function saveSubjectsDB(updatedSubjects) {
      localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(updatedSubjects));
    }

    // 3. Lógica CRUD sobre la tabla de materias
    const form         = document.getElementById("subject-crud-form");
    const editIndexInp = document.getElementById("edit-index");
    const codeInp      = document.getElementById("f-code");
    const nameInp      = document.getElementById("f-name");
    const creditsInp   = document.getElementById("f-credits");
    const semesterSel  = document.getElementById("f-semester");
    const formTitle    = document.getElementById("form-title");
    const submitBtn    = document.getElementById("submit-btn");
    const cancelBtn    = document.getElementById("cancel-edit-btn");
    const tbody        = document.getElementById("subjects-table-body");

    function renderSubjectsTable() {
      const subjects = getSubjectsDB();
      tbody.innerHTML = "";

      subjects.forEach((sub, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td><span class="code-badge">${sub.code}</span></td>
          <td><strong>${sub.name}</strong></td>
          <td style="text-align: center;">${sub.credits}</td>
          <td style="text-align: center;">${sub.semester}° Sem</td>
          <td>
            <div class="action-btns">
              <button class="btn-sm" onclick="editSubject(${index})">Editar</button>
              <button class="btn-sm btn-del" onclick="deleteSubject(${index})">Eliminar</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Alta y Actualización (Create / Update)
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const subjects = getSubjectsDB();
      const idx = parseInt(editIndexInp.value, 10);

      const subjectRecord = {
        code: codeInp.value.trim().toUpperCase(),
        name: nameInp.value.trim(),
        credits: parseInt(creditsInp.value, 10),
        semester: parseInt(semesterSel.value, 10)
      };

      if (idx === -1) {
        if (subjects.some(s => s.code.toLowerCase() === subjectRecord.code.toLowerCase())) {
          alert("Error: Ya existe una materia registrada con esa clave.");
          return;
        }
        subjects.push(subjectRecord);
      } else {
        subjects[idx] = subjectRecord;
      }

      saveSubjectsDB(subjects);
      resetForm();
      renderSubjectsTable();
    });

    // Cargar datos en formulario para editar
    window.editSubject = function(index) {
      const subjects = getSubjectsDB();
      const s = subjects[index];
      editIndexInp.value = index;
      codeInp.value = s.code;
      nameInp.value = s.name;
      creditsInp.value = s.credits;
      semesterSel.value = s.semester;

      formTitle.textContent = `Editando: ${s.code}`;
      submitBtn.textContent = "Actualizar Materia";
      cancelBtn.style.display = "block";
    };

    // Eliminar materia (Delete)
    window.deleteSubject = function(index) {
      const subjects = getSubjectsDB();
      const target = subjects[index];

      if (confirm(`¿Seguro que deseas eliminar la materia "${target.name}" (${target.code})?`)) {
        subjects.splice(index, 1);
        saveSubjectsDB(subjects);
        renderSubjectsTable();
      }
    };

    function resetForm() {
      form.reset();
      editIndexInp.value = "-1";
      formTitle.textContent = "Registrar Nueva Materia";
      submitBtn.textContent = "Guardar Materia";
      cancelBtn.style.display = "none";
    }

    cancelBtn.addEventListener("click", resetForm);
    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    // Arranque
    renderSubjectsTable();
  </script>
</body>
</html>
