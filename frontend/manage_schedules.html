<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Horarios - Dirección</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container {
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
    }

    .mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 2.4fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.90rem;
      margin-top: 4px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    .filter-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .topbar-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }

    .action-btns { display: flex; gap: 6px; }
    .btn-edit {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid #3b82f6;
      color: #3b82f6;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-edit:hover { background: #3b82f6; color: white; }

    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete:hover { background: #ef4444; color: white; }

    .btn-cancel-edit {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 6px;
      width: 100%;
    }
    .btn-cancel-edit:hover { border-color: var(--text-main); color: var(--text-main); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Académico</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario (Crear / Editar) -->
      <div class="panel-card">
        <h2 id="form-title" style="font-size: 1.1rem; margin-bottom: 16px;">Asignar Horario / Clase</h2>
        <form id="schedule-form">
          
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-teacher">Profesor a Cargo</label>
            <select id="f-teacher" required>
              <option value="">Seleccione un profesor...</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-subject">Materia (Catálogo)</label>
            <select id="f-subject" required>
              <option value="">Seleccione una materia...</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-period">Periodo Semestral</label>
            <input type="text" id="f-period" value="2026-1" required>
          </div>

          <div class="form-group" style="margin-bottom: 14px;" id="days-container-wrapper">
            <label id="days-label">Días de la Semana (Selecciona uno o varios)</label>
            <div id="days-checkboxes" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; background: var(--bg-input); padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
              <label style="font-size: 0.8rem; cursor: pointer;"><input type="checkbox" name="day" value="Lunes"> Lunes</label>
              <label style="font-size: 0.8rem; cursor: pointer;"><input type="checkbox" name="day" value="Martes"> Martes</label>
              <label style="font-size: 0.8rem; cursor: pointer;"><input type="checkbox" name="day" value="Miércoles"> Miércoles</label>
              <label style="font-size: 0.8rem; cursor: pointer;"><input type="checkbox" name="day" value="Jueves"> Jueves</label>
              <label style="font-size: 0.8rem; cursor: pointer;"><input type="checkbox" name="day" value="Viernes"> Viernes</label>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
            <div class="form-group">
              <label for="f-start">Hora Inicio</label>
              <input type="time" id="f-start" required>
            </div>
            <div class="form-group">
              <label for="f-end">Hora Fin</label>
              <input type="time" id="f-end" required>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label for="f-room">Aula / Laboratorio</label>
            <input type="text" id="f-room" placeholder="Ej. Lab-3 o Salón 204" required>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%;">Asignar Clase</button>
          <button type="button" id="cancel-edit-btn" class="btn-cancel-edit" style="display: none;">Cancelar Edición</button>
          <div id="form-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px;"></div>
        </form>
      </div>

      <!-- Columna Derecha: Tabla y Filtros -->
      <div class="panel-card" style="overflow-x: auto;">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Horarios y Asignaciones Vigentes</h2>
        
        <!-- Barra de Filtros -->
        <div class="filter-bar">
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted);">Filtrar Semestre</label>
            <select id="filter-semester">
              <option value="">Todos los semestres</option>
              <option value="1">Semestre 1</option>
              <option value="2">Semestre 2</option>
              <option value="3">Semestre 3</option>
              <option value="4">Semestre 4</option>
              <option value="5">Semestre 5</option>
              <option value="6">Semestre 6</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted);">Filtrar Día</label>
            <select id="filter-day">
              <option value="">Todos los días</option>
              <option value="Lunes">Lunes</option>
              <option value="Martes">Martes</option>
              <option value="Miércoles">Miércoles</option>
              <option value="Jueves">Jueves</option>
              <option value="Viernes">Viernes</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--text-muted);">Buscar Texto</label>
            <input type="text" id="filter-search" placeholder="Materia, profe, aula...">
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Día / Hora</th>
              <th>Materia</th>
              <th>Profesor</th>
              <th>Aula</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="schedules-table-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    const currentSession = requireAuth();
    if (!currentSession || currentSession.level < 3) {
      alert("Acceso denegado: Se requieren privilegios de Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Director" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    const form          = document.getElementById("schedule-form");
    const formTitle     = document.getElementById("form-title");
    const teacherSel    = document.getElementById("f-teacher");
    const subjectSel    = document.getElementById("f-subject");
    const periodInp     = document.getElementById("f-period");
    const startInp      = document.getElementById("f-start");
    const endInp        = document.getElementById("f-end");
    const roomInp       = document.getElementById("f-room");
    const submitBtn     = document.getElementById("submit-btn");
    const cancelEditBtn = document.getElementById("cancel-edit-btn");
    const formError     = document.getElementById("form-error");
    const tbody         = document.getElementById("schedules-table-body");

    const daysWrapper   = document.getElementById("days-container-wrapper");
    const filterSemester= document.getElementById("filter-semester");
    const filterDay     = document.getElementById("filter-day");
    const filterSearch  = document.getElementById("filter-search");

    let allSchedules = [];
    let editingId    = null; // Almacena el ID si estamos editando

    async function loadSelectOptions() {
      try {
        const [usersRes, subjectsRes] = await Promise.all([
          fetch(`${API_BASE_URL}/users`),
          fetch(`${API_BASE_URL}/subjects`)
        ]);

        const users = await usersRes.json();
        const subjects = await subjectsRes.json();

        teacherSel.innerHTML = '<option value="">Seleccione un profesor...</option>';
        users.filter(u => u.level >= 2).forEach(u => {
          teacherSel.innerHTML += `<option value="${u.id}">${u.fullName} (${u.roleName})</option>`;
        });

        subjectSel.innerHTML = '<option value="">Seleccione una materia...</option>';
        subjects.forEach(sub => {
          subjectSel.innerHTML += `<option value="${sub.id}">[${sub.code}] ${sub.name} (Semestre ${sub.semester})</option>`;
        });
      } catch (err) {
        console.error("Error cargando catálogos auxiliares:", err);
      }
    }

    async function loadSchedulesTable() {
      try {
        const response = await fetch(`${API_BASE_URL}/schedules`);
        if (!response.ok) throw new Error("Error al obtener los horarios.");
        allSchedules = await response.json();
        renderFilteredSchedules();
      } catch (err) {
        console.error("Error de conexión:", err);
        tbody.innerHTML = `<tr><td colspan="5" style="color: #ef4444; text-align: center;">Error conectando con FastAPI.</td></tr>`;
      }
    }

    function renderFilteredSchedules() {
      const semVal = filterSemester.value;
      const dayVal = filterDay.value;
      const textVal = filterSearch.value.toLowerCase().trim();

      const filtered = allSchedules.filter(item => {
        const matchSem = !semVal || String(item.semester) === semVal;
        const matchDay = !dayVal || item.day === dayVal;
        const matchText = !textVal || 
          item.subjectCode.toLowerCase().includes(textVal) ||
          (item.subjectName && item.subjectName.toLowerCase().includes(textVal)) ||
          (item.teacherName && item.teacherName.toLowerCase().includes(textVal)) ||
          item.room.toLowerCase().includes(textVal);

        return matchSem && matchDay && matchText;
      });

      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">No se encontraron horarios con los filtros seleccionados.</td></tr>`;
        return;
      }

      filtered.forEach((sch) => {
        tbody.innerHTML += `
          <tr>
            <td>
              <strong>${sch.day}</strong><br>
              <span style="font-size: 0.78rem; color: var(--text-muted);">${sch.startTime} - ${sch.endTime}</span>
            </td>
            <td>
              <strong>${sch.subjectCode}</strong><br>
              <span style="font-size: 0.78rem; color: var(--text-muted);">${sch.subjectName || ''}</span>
            </td>
            <td>${sch.teacherName || sch.studentUser}</td>
            <td><code>${sch.room}</code></td>
            <td>
              <div class="action-btns">
                <button class="btn-edit" onclick="startEdit(${sch.id})">Editar</button>
                <button class="btn-delete" onclick="deleteSchedule(${sch.id})">Eliminar</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    // Cargar datos en el formulario para editar
    window.startEdit = function(id) {
      const item = allSchedules.find(s => s.id === id);
      if (!item) return;

      editingId = id;
      formTitle.textContent = `Editar Horario (ID: ${id})`;
      submitBtn.textContent = "Actualizar Cambios";
      cancelEditBtn.style.display = "block";

      // Seleccionar valores en el form
      teacherSel.value = item.user_id || ""; 
      // Si el user_id no viniera directo, buscamos por coincidencia de nombre o ID si tu endpoint lo devuelve. 
      // Aseguremos que el objeto devuelto por GET /api/schedules incluya user_id y subject_id:
      // Vamos a ajustar el SELECT de SQLite para incluir user_id y subject_id explícitamente abajo.
      
      teacherSel.value = item.user_id;
      subjectSel.value = item.subject_id;
      periodInp.value = item.semester_period || "2026-1";
      startInp.value = item.startTime;
      endInp.value = item.endTime;
      roomInp.value = item.room;

      // Al editar, convertimos los checkboxes en un selector de un solo día o marcamos ese día exclusivamente
      document.querySelectorAll('input[name="day"]').forEach(cb => {
        cb.checked = (cb.value === item.day);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetFormMode() {
      editingId = null;
      formTitle.textContent = "Asignar Horario / Clase";
      submitBtn.textContent = "Asignar Clase";
      cancelEditBtn.style.display = "none";
      form.reset();
      periodInp.value = "2026-1";
      document.querySelectorAll('input[name="day"]').forEach(cb => cb.checked = false);
    }

    cancelEditBtn.addEventListener("click", resetFormMode);

    async function deleteSchedule(id) {
      if (!confirm("¿Estás seguro de eliminar esta asignación de horario?")) return;
      try {
        const response = await fetch(`${API_BASE_URL}/schedules/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("No se pudo eliminar el registro.");
        loadSchedulesTable();
        if (editingId === id) resetFormMode();
      } catch (err) {
        alert(err.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      const checkedDays = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(cb => cb.value);
      if (checkedDays.length === 0) {
        formError.textContent = "Debes seleccionar al menos un día de la semana.";
        return;
      }

      try {
        if (editingId) {
          // MODO EDICIÓN (Toma el primer día marcado si editó)
          const payload = {
            user_id: parseInt(teacherSel.value, 10),
            subject_id: parseInt(subjectSel.value, 10),
            semester_period: periodInp.value.trim(),
            day_of_week: checkedDays[0],
            start_time: startInp.value,
            end_time: endInp.value,
            room: roomInp.value.trim()
          };

          const response = await fetch(`${API_BASE_URL}/schedules/${editingId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Error al actualizar el horario.");

          resetFormMode();
          loadSchedulesTable();

        } else {
          // MODO CREACIÓN (Múltiples días)
          const basePayload = {
            user_id: parseInt(teacherSel.value, 10),
            subject_id: parseInt(subjectSel.value, 10),
            semester_period: periodInp.value.trim(),
            start_time: startInp.value,
            end_time: endInp.value,
            room: roomInp.value.trim()
          };

          for (const day of checkedDays) {
            const payload = { ...basePayload, day_of_week: day };
            const response = await fetch(`${API_BASE_URL}/schedules`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.detail || `Error al registrar horario para ${day}.`);
            }
          }

          form.reset();
          periodInp.value = "2026-1";
          loadSchedulesTable();
        }
      } catch (err) {
        formError.textContent = err.message;
      }
    });

    filterSemester.addEventListener("change", renderFilteredSchedules);
    filterDay.addEventListener("change", renderFilteredSchedules);
    filterSearch.addEventListener("input", renderFilteredSchedules);

    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    loadSelectOptions();
    loadSchedulesTable();
  </script>
</body>
</html>
