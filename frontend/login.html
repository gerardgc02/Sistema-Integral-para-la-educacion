<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema RBAC</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .theme-corner {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .btn-theme {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-theme:hover {
      border-color: var(--accent);
      background: var(--bg-card);
    }
  </style>
</head>
<body>

  <!-- Botón de cambio de tema -->
  <div class="theme-corner">
    <button id="theme-toggle-btn" class="btn-theme">🌓 Tema</button>
  </div>

  <div class="login-wrapper">
    <div class="card">
      <h1>Acceso al Sistema</h1>
      <p class="subtitle">El sistema detectará automáticamente tu nivel de privilegios.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Ej. Alumno1" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••" required>
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        <div id="login-error" class="error-msg" style="color: #ef4444; margin-top: 10px; font-size: 0.85rem;"></div>
      </form>
    </div>

    <div class="card">
      <h1>Usuarios de Prueba</h1>
      <p class="subtitle">Haz clic en un perfil para autocompletar credenciales:</p>
      <div class="quick-users" id="quick-users-list"></div>
    </div>
  </div>

  <!-- Importamos el módulo de autenticación -->
  <script src="js/auth.js"></script>
  <script>
    // 1. Gestión del Tema Oscuro / Claro
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }

    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      const isLight = document.body.classList.contains("light-theme");
      localStorage.setItem("rbac_theme", isLight ? "light" : "dark");
    });

    // 2. Si ya hay una sesión activa, saltamos directo al dashboard
    if (getActiveSession()) {
      window.location.href = "dashboard.html";
    }

    const loginForm      = document.getElementById("login-form");
    const loginError     = document.getElementById("login-error");
    const quickUsersList = document.getElementById("quick-users-list");

    // 3. Cargar usuarios de prueba dinámicamente desde FastAPI (SQLite)
    async function loadQuickUsers() {
      try {
        const response = await fetch("http://127.0.0.1:8000/api/users");
        if (!response.ok) return;
        const users = await response.json();

        quickUsersList.innerHTML = "";
        users.forEach(u => {
          const meta = ROLE_META[u.level] || { name: "Usuario", color: "#64748b" };
          const chip = document.createElement("div");
          chip.className = "user-chip";
          chip.style.cssText = "padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: var(--bg-input); display: flex; justify-content: space-between; align-items: center;";
          
          chip.innerHTML = `
            <div>
              <strong>${u.user}</strong> <span style="color:var(--text-muted); font-size:0.8rem;">(pass: ${u.pass})</span>
              <div style="font-size:0.8rem; color:var(--text-muted);">${u.fullName}</div>
            </div>
            <span class="badge" style="background:${meta.color}; color:#fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">LVL ${u.level} - ${meta.name}</span>
          `;
          
          chip.onclick = () => {
            document.getElementById("username").value = u.user;
            document.getElementById("password").value = u.pass;
            loginError.textContent = "";
          };
          quickUsersList.appendChild(chip);
        });
      } catch (err) {
        quickUsersList.innerHTML = "<p style='color:var(--text-muted); font-size:0.85rem;'>Backend desconectado. Enciende FastAPI.</p>";
      }
    }

    loadQuickUsers();

    // 4. Manejo del formulario de inicio de sesión de forma asíncrona (AWAIT)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      
      const userVal = document.getElementById("username").value;
      const passVal = document.getElementById("password").value;

      // Usamos await porque loginUser realiza una petición fetch al backend
      const session = await loginUser(userVal, passVal);

      if (!session) {
        loginError.textContent = "Error: Credenciales inválidas o servidor inactivo.";
        return;
      }

      // Redirección limpia al dashboard
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
