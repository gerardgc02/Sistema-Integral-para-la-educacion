<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión y Control de Calificaciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container { max-width: 1250px; width: 100%; margin: 0 auto; }
    .mgmt-grid { display: grid; grid-template-columns: 1fr 2.3fr; gap: 20px; margin-top: 20px; }
    @media (max-width: 900px) { .mgmt-grid { grid-template-columns: 1fr; } }
    .panel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    input, select { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 0.90rem; margin-top: 4px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
    .topbar-actions { display: flex; gap: 10px; }
    .btn-back { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }
    
    .action-btns { display: flex; gap: 6px; }
    .btn-edit { background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; color: #3b82f6; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-edit:hover { background: #3b82f6; color: white; }
    .btn-delete { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-delete:hover { background: #ef4444; color: white; }
    .btn-cancel-edit { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; width: 100%; }
    .btn-cancel-edit:hover { border-color: var(--text-main); color: var(--text-main); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Docente / Directivo</div>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario (Crear / Editar) -->
      <div class="panel-card">
        <h2 id="form-title" style="font-size: 1.1rem; margin-bottom: 16px;">Asentar Calificaciones</h2>
        <form id="grade-form">
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="f-student">Alumno</label>
            <select id="f-student" required><option value="">Seleccione un alumno...</option></select>
          </div>
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="f-subject">Materia</label>
            <select id="f-subject" required><option value="">Seleccione una materia...</option></select>
          </div>
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="f-period">Periodo Semestral</label>
            <input type="text" id="f-period" value="2026-1" required>
          </div>

          <!-- Unidades 1 a 4 -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
            <div>
              <label for="f-u1" style="font-size: 0.8rem;">Unidad 1</label>
              <input type="number" id="f-u1" step="0.1" min="0" max="10" placeholder="Ej. 9.0">
            </div>
            <div>
              <label for="f-u2" style="font-size: 0.8rem;">Unidad 2</label>
              <input type="number" id="f-u2" step="0.1" min="0" max="10" placeholder="Ej. 8.5">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
            <div>
              <label for="f-u3" style="font-size: 0.8rem;">Unidad 3</label>
              <input type="number" id="f-u3" step="0.1" min="0" max="10" placeholder="Ej. 9.2">
            </div>
            <div>
              <label for="f-u4" style="font-size: 0.8rem;">Unidad 4</label>
              <input type="number" id="f-u4" step="0.1" min="0" max="10" placeholder="Ej. 8.8">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label for="f-status">Estatus</label>
            <select id="f-status">
              <option value="Cursando">Cursando</option>
              <option value="Aprobada">Aprobada</option>
              <option value="Reprobada">Reprobada</option>
            </select>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%;">Guardar Calificación</button>
          <button type="button" id="cancel-edit-btn" class="btn-cancel-edit" style="display: none;">Cancelar Edición</button>
          <div id="form-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px;"></div>
        </form>
      </div>

      <!-- Columna Derecha: Listado general -->
      <div class="panel-card" style="overflow-x: auto;">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Historial de Calificaciones Registradas</h2>
        <table>
          <thead>
            <tr>
              <th>Alumno</th>
              <th>Materia</th>
              <th>Periodo</th>
              <th>U1 | U2 | U3 | U4</th>
              <th>Estatus</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="grades-table-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") document.body.classList.add("light-theme");
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    const currentSession = requireAuth();
    if (!currentSession || currentSession.level < 2) {
      alert("Acceso denegado: Se requieren privilegios de Maestro o Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Docente" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    const form          = document.getElementById("grade-form");
    const formTitle     = document.getElementById("form-title");
    const studentSel    = document.getElementById("f-student");
    const subjectSel    = document.getElementById("f-subject");
    const periodInp     = document.getElementById("f-period");
    const u1Inp         = document.getElementById("f-u1");
    const u2Inp         = document.getElementById("f-u2");
    const u3Inp         = document.getElementById("f-u3");
    const u4Inp         = document.getElementById("f-u4");
    const statusSel     = document.getElementById("f-status");
    const submitBtn     = document.getElementById("submit-btn");
    const cancelEditBtn = document.getElementById("cancel-edit-btn");
    const formError     = document.getElementById("form-error");
    const tbody         = document.getElementById("grades-table-body");

    let allGrades = [];
    let editingId = null;

    async function loadSelects() {
      try {
        const [usersRes, subsRes] = await Promise.all([
          fetch(`${API_BASE_URL}/users`),
          fetch(`${API_BASE_URL}/subjects`)
        ]);
        const users = await usersRes.json();
        const subjects = await subsRes.json();

        studentSel.innerHTML = '<option value="">Seleccione un alumno...</option>';
        users.filter(u => u.level === 1).forEach(u => {
          studentSel.innerHTML += `<option value="${u.id}">${u.fullName} (${u.username})</option>`;
        });

        subjectSel.innerHTML = '<option value="">Seleccione una materia...</option>';
        subjects.forEach(sub => {
          subjectSel.innerHTML += `<option value="${sub.id}">[${sub.code}] ${sub.name}</option>`;
        });
      } catch (err) {
        console.error("Error cargando catálogos:", err);
      }
    }

    async function loadGrades() {
      try {
        const res = await fetch(`${API_BASE_URL}/grades`);
        if (!res.ok) throw new Error("Error al obtener calificaciones.");
        allGrades = await res.json();

        tbody.innerHTML = "";
        if (allGrades.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No hay calificaciones registradas.</td></tr>`;
          return;
        }

        allGrades.forEach(g => {
          const formatScore = (val) => (val !== null && val !== undefined) ? val.toFixed(1) : '-';
          const unitsStr = `${formatScore(g.unit_1)} | ${formatScore(g.unit_2)} | ${formatScore(g.unit_3)} | ${formatScore(g.unit_4)}`;
          
          tbody.innerHTML += `
            <tr>
              <td><strong>${g.studentName}</strong></td>
              <td><strong>${g.subjectCode}</strong> - ${g.subjectName}</td>
              <td>${g.semester_period}</td>
              <td><code>${unitsStr}</code></td>
              <td><span style="font-weight: bold; color: var(--accent);">${g.status || 'Cursando'}</span></td>
              <td>
                <div class="action-btns">
                  <button class="btn-edit" onclick="startEdit(${g.id})">Editar</button>
                  <button class="btn-delete" onclick="deleteGrade(${g.id})">Eliminar</button>
                </div>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="6" style="color: #ef4444; text-align: center;">Error conectando con la API.</td></tr>`;
      }
    }

    // Cargar datos en el formulario para editar
    window.startEdit = function(id) {
      const item = allGrades.find(g => g.id === id);
      if (!item) return;

      editingId = id;
      formTitle.textContent = `Editar Calificación (ID: ${id})`;
      submitBtn.textContent = "Actualizar Cambios";
      cancelEditBtn.style.display = "block";

      studentSel.value = item.user_id;
      subjectSel.value = item.subject_id;
      studentSel.disabled = true; // Bloquear alumno y materia durante edición
      subjectSel.disabled = true;// Bloquear alumno y materia durante edición

      periodInp.value = item.semester_period || "2026-1";
      u1Inp.value = item.unit_1 !== null ? item.unit_1 : "";
      u2Inp.value = item.unit_2 !== null ? item.unit_2 : "";
      u3Inp.value = item.unit_3 !== null ? item.unit_3 : "";
      u4Inp.value = item.unit_4 !== null ? item.unit_4 : "";
      statusSel.value = item.status || "Cursando";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetFormMode() {
      editingId = null;
      formTitle.textContent = "Asentar Calificaciones";
      submitBtn.textContent = "Guardar Calificación";
      cancelEditBtn.style.display = "none";
      form.reset();
      periodInp.value = "2026-1";
      studentSel.disabled = false;
      subjectSel.disabled = false;
    }

    cancelEditBtn.addEventListener("click", resetFormMode);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      const payload = {
        user_id: parseInt(studentSel.value, 10),
        subject_id: parseInt(subjectSel.value, 10),
        semester_period: periodInp.value.trim(),
        unit_1: u1Inp.value ? parseFloat(u1Inp.value) : null,
        unit_2: u2Inp.value ? parseFloat(u2Inp.value) : null,
        unit_3: u3Inp.value ? parseFloat(u3Inp.value) : null,
        unit_4: u4Inp.value ? parseFloat(u4Inp.value) : null,
        status: statusSel.value
      };

      try {
        let res, data;
        if (editingId) {
          // MODO EDICIÓN (PUT)
          res = await fetch(`${API_BASE_URL}/grades/${editingId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } else {
          // MODO CREACIÓN (POST)
          res = await fetch(`${API_BASE_URL}/grades`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }

        data = await res.json();
        if (!res.ok) throw new Error(data.detail || "No se pudo guardar la calificación.");

        resetFormMode();
        loadGrades();
      } catch (err) {
        formError.textContent = err.message;
      }
    });

    window.deleteGrade = async function(id) {
      if (!confirm("¿Eliminar este registro de calificaciones?")) return;
      try {
        const res = await fetch(`${API_BASE_URL}/grades/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("No se pudo eliminar.");
        loadGrades();
        if (editingId === id) resetFormMode();
      } catch (err) {
        alert(err.message);
      }
    };

    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    loadSelects();
    loadGrades();
  </script>
</body>
</html>
