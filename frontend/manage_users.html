<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Dirección</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container {
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
    }

    .mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 2.2fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* Estilos para las Pestañas de Filtro */
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    select:focus { outline: none; border-color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .action-btns { display: flex; gap: 6px; }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent); }
    .btn-del:hover { border-color: #ef4444; color: #ef4444; }

    .topbar-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Administrativo</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario Alta -->
      <div class="panel-card">
        <h2 id="form-title" style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Usuario</h2>
        <form id="user-crud-form">
          <div class="form-group">
            <label for="f-level">Tipo de Perfil</label>
            <select id="f-level" required>
              <option value="1">Nivel 1 - Alumno</option>
              <option value="2">Nivel 2 - Maestro</option>
              <option value="3">Nivel 3 - Director</option>
            </select>
          </div>

          <div class="form-group">
            <label for="f-fullname">Nombre Completo</label>
            <input type="text" id="f-fullname" placeholder="Ej. Laura Gómez" required>
          </div>

          <div class="form-group">
            <label for="f-username">Usuario de Acceso</label>
            <input type="text" id="f-username" placeholder="Ej. Alumno2" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="f-password">Contraseña</label>
            <input type="text" id="f-password" placeholder="Ej. 1234" required autocomplete="off">
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Guardar Registro en SQLite</button>
          <div id="form-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px;"></div>
        </form>
      </div>

      <!-- Columna Derecha: Tabla con Pestañas por Rol -->
      <div class="panel-card" style="overflow-x: auto;">
        <div class="tabs-bar" id="role-tabs">
          <button class="tab-btn active" data-filter="1">🎓 Alumnos</button>
          <button class="tab-btn" data-filter="2">👨‍🏫 Maestros</button>
          <button class="tab-btn" data-filter="3">🏛️ Directores / Admin</button>
          <button class="tab-btn" data-filter="all">📋 Ver Todos</button>
        </div>

        <h2 id="table-heading" style="font-size: 1rem; margin-bottom: 12px; color: var(--text-muted);">
          Padrón de Alumnos Registrados
        </h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Contraseña</th>
              <th>Perfil</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Se llena dinámicamente según la pestaña activa -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // 0. Tema Oscuro / Claro
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    // 1. Guardia de Seguridad
    const currentSession = requireAuth();
    if (!currentSession || currentSession.level < 3) {
      alert("Acceso denegado: Se requieren privilegios de Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Director" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    const form         = document.getElementById("user-crud-form");
    const fullnameInp  = document.getElementById("f-fullname");
    const usernameInp  = document.getElementById("f-username");
    const passwordInp  = document.getElementById("f-password");
    const levelSel     = document.getElementById("f-level");
    const formError    = document.getElementById("form-error");
    const tbody        = document.getElementById("users-table-body");
    const tableHeading = document.getElementById("table-heading");
    const tabButtons   = document.querySelectorAll(".tab-btn");

    // Estado local en memoria para filtrar sin recargar red
    let allUsersCache = [];
    let activeFilter  = "1"; // Por defecto abre en Alumnos

    const HEADING_TITLES = {
      "1": "Padrón de Alumnos Registrados",
      "2": "Plantilla Docente (Maestros)",
      "3": "Personal Directivo y Administradores",
      "all": "Todos los Usuarios del Sistema"
    };

    // 2. Obtener datos completos de FastAPI
    async function fetchUsersFromDB() {
      try {
        const response = await fetch(`${API_BASE_URL}/users`);
        if (!response.ok) throw new Error("Error al consultar la API.");
        allUsersCache = await response.json();
        renderFilteredTable();
      } catch (err) {
        console.error("Error de conexión:", err);
        tbody.innerHTML = `<tr><td colspan="6" style="color: #ef4444; text-align: center;">Error conectando con FastAPI.</td></tr>`;
      }
    }

    // 3. Renderizar tabla filtrada por la pestaña seleccionada
    function renderFilteredTable() {
      tbody.innerHTML = "";
      tableHeading.textContent = HEADING_TITLES[activeFilter] || "Usuarios";

      const filteredUsers = allUsersCache.filter(u => {
        if (activeFilter === "all") return true;
        if (activeFilter === "3") return u.level >= 3; // Agrupa Director (3) y Admin (4)
        return String(u.level) === activeFilter;
      });

      if (filteredUsers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No hay registros en esta categoría.</td></tr>`;
        return;
      }

      filteredUsers.forEach((u) => {
        const roleInfo = ROLE_META[u.level] || { name: "Desconocido", color: "#64748b" };
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${u.id}</td>
          <td><strong>${u.fullName}</strong></td>
          <td>${u.user}</td>
          <td style="font-family: monospace; color: var(--text-muted);">${u.pass}</td>
          <td><span class="badge" style="background:${roleInfo.color}; color:#fff; padding: 2px 6px; border-radius: 4px;">${roleInfo.name}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-sm btn-del" onclick="deleteUser(${u.id}, '${u.user}')">Eliminar</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 4. Manejo de clics en las pestañas
    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        tabButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        activeFilter = btn.getAttribute("data-filter");
        
        // Sincronizar el selector del formulario con la pestaña elegida
        if (activeFilter !== "all") {
          levelSel.value = activeFilter;
        }

        renderFilteredTable();
      });
    });

    // 5. Registrar nuevo usuario en SQLite
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      const selectedLevel = parseInt(levelSel.value, 10);
      const payload = {
        username: usernameInp.value.trim(),
        password_hash: passwordInp.value.trim(),
        full_name: fullnameInp.value.trim(),
        role_id: selectedLevel
      };

      try {
        const response = await fetch(`${API_BASE_URL}/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "No se pudo registrar.");

        form.reset();
        levelSel.value = selectedLevel; // Mantener el rol seleccionado
        await fetchUsersFromDB();
      } catch (err) {
        formError.textContent = err.message;
      }
    });

    // 6. Eliminar usuario
    window.deleteUser = async function(userId, username) {
      if (username === currentSession.user) {
        alert("No puedes eliminar tu propia cuenta.");
        return;
      }

      if (!confirm(`¿Eliminar al usuario '${username}' de la base de datos?`)) return;

      try {
        const response = await fetch(`${API_BASE_URL}/users/${userId}`, { method: "DELETE" });
        if (response.ok) {
          await fetchUsersFromDB();
        } else {
          alert("No se pudo eliminar en el servidor.");
        }
      } catch (err) {
        console.error("Error al eliminar:", err);
      }
    };

    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    // Arranque
    fetchUsersFromDB();
  </script>
</body>
</html>
