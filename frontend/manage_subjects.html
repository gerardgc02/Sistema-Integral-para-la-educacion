<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Materias - Dirección</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 2.2fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .topbar-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Curricular</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario Alta de Materia -->
      <div class="panel-card">
        <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Nueva Materia</h2>
        <form id="subject-form">
          
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-code">Clave / Código</label>
            <input type="text" id="f-code" placeholder="Ej. MAT-102" required style="text-transform: uppercase;">
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-name">Nombre de la Materia</label>
            <input type="text" id="f-name" placeholder="Ej. Cálculo Diferencial" required>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="f-credits">Créditos</label>
            <input type="number" id="f-credits" min="1" max="15" value="6" required>
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label for="f-semester">Nivel / Semestre</label>
            <select id="f-semester" required>
              <option value="1">Semestre 1</option>
              <option value="2">Semestre 2</option>
              <option value="3">Semestre 3</option>
              <option value="4">Semestre 4</option>
              <option value="5">Semestre 5</option>
              <option value="6">Semestre 6</option>
              <option value="7">Semestre 7</option>
              <option value="8">Semestre 8</option>
            </select>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%;">Guardar Materia</button>
          <div id="form-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 8px;"></div>
        </form>
      </div>

      <!-- Columna Derecha: Catálogo de Materias desde SQLite -->
      <div class="panel-card" style="overflow-x: auto;">
        <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Catálogo General de Materias</h2>
        <table>
          <thead>
            <tr>
              <th>Clave</th>
              <th>Nombre</th>
              <th>Créditos</th>
              <th>Semestre</th>
            </tr>
          </thead>
          <tbody id="subjects-table-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // 0. Tema Oscuro / Claro
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    // 1. Guardia de Seguridad (Nivel >= 3)
    const currentSession = requireAuth();
    if (!currentSession || currentSession.level < 3) {
      alert("Acceso denegado: Se requieren privilegios de Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Director" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    const form      = document.getElementById("subject-form");
    const codeInp   = document.getElementById("f-code");
    const nameInp   = document.getElementById("f-name");
    const creditsInp= document.getElementById("f-credits");
    const semesterSel = document.getElementById("f-semester");
    const formError = document.getElementById("form-error");
    const tbody     = document.getElementById("subjects-table-body");

    // 2. Cargar catálogo de materias desde FastAPI (GET)
    async function loadSubjectsTable() {
      try {
        const response = await fetch(`${API_BASE_URL}/subjects`);
        if (!response.ok) throw new Error("Error al obtener el catálogo de materias.");
        
        const subjects = await response.json();
        tbody.innerHTML = "";

        if (subjects.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">No hay materias registradas en el catálogo.</td></tr>`;
          return;
        }

        subjects.forEach((sub) => {
          tbody.innerHTML += `
            <tr>
              <td><code>${sub.code}</code></td>
              <td><strong>${sub.name}</strong></td>
              <td>${sub.credits}</td>
              <td>Semestre ${sub.semester}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Error de conexión:", err);
        tbody.innerHTML = `<tr><td colspan="4" style="color: #ef4444; text-align: center;">Error conectando con FastAPI.</td></tr>`;
      }
    }

    // 3. Registrar nueva materia en el catálogo (POST)
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formError.textContent = "";

      const payload = {
        code: codeInp.value.trim().toUpperCase(),
        name: nameInp.value.trim(),
        credits: parseInt(creditsInp.value, 10),
        semester_level: parseInt(semesterSel.value, 10)
      };

      try {
        const response = await fetch(`${API_BASE_URL}/subjects`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "No se pudo registrar la materia.");

        form.reset();
        creditsInp.value = "6"; // Restablecer valor predeterminado
        loadSubjectsTable();
      } catch (err) {
        formError.textContent = err.message;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    // Inicializar vista
    loadSubjectsTable();
  </script>
</body>
</html>
