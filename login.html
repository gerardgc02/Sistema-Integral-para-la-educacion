<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema RBAC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="card">
      <h1>Acceso al Sistema</h1>
      <p class="subtitle">El sistema detectará automáticamente tu nivel de privilegios.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Ej. operador1" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••" required>
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        <div id="login-error" class="error-msg"></div>
      </form>
    </div>

    <div class="card">
      <h1>Usuarios de Prueba</h1>
      <p class="subtitle">Haz clic en un perfil para autocompletar credenciales:</p>
      <div class="quick-users" id="quick-users-list"></div>
    </div>
  </div>

  <!-- Importamos el módulo de autenticación -->
  <script src="js/auth.js"></script>
  <script>
    // Si ya hay una sesión activa, saltamos directo al dashboard
    if (getActiveSession()) {
      window.location.href = "dashboard.html";
    }

    const loginForm      = document.getElementById("login-form");
    const loginError     = document.getElementById("login-error");
    const quickUsersList = document.getElementById("quick-users-list");

    // Renderizar tarjetas de prueba usando USERS_DB y ROLE_META desde auth.js
    USERS_DB.forEach(u => {
      const meta = ROLE_META[u.level];
      const chip = document.createElement("div");
      chip.className = "user-chip";
      chip.innerHTML = `
        <div>
          <strong>${u.user}</strong> <span style="color:var(--text-muted); font-size:0.8rem;">(pass: ${u.pass})</span>
          <div style="font-size:0.8rem; color:var(--text-muted);">${u.fullName}</div>
        </div>
        <span class="badge" style="background:${meta.color}">LVL ${u.level} - ${meta.name}</span>
      `;
      chip.onclick = () => {
        document.getElementById("username").value = u.user;
        document.getElementById("password").value = u.pass;
        loginError.textContent = "";
      };
      quickUsersList.appendChild(chip);
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const userVal = document.getElementById("username").value;
      const passVal = document.getElementById("password").value;

      const session = loginUser(userVal, passVal);

      if (!session) {
        loginError.textContent = "Error: Credenciales inválidas.";
        return;
      }

      // Redirección limpia al dashboard
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
