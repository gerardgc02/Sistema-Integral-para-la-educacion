<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Dirección</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mgmt-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .mgmt-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    select:focus { outline: none; border-color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent); }
    .btn-del:hover { border-color: #ef4444; color: #ef4444; }

    .topbar-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-back:hover { border-color: var(--accent); background: var(--bg-input); }
  </style>
</head>
<body>

  <div class="mgmt-container">
    <header class="topbar">
      <div class="user-meta">
        <div>
          <strong id="display-name">Usuario</strong>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="display-role">Control Administrativo</div>
        </div>
      </div>

      <div class="topbar-actions">
        <a href="dashboard.html" class="btn-back">← Volver al Menú</a>
        <button id="theme-toggle-btn" class="btn-theme" style="background:transparent; border:1px solid var(--border); color:var(--text-main); padding:8px 14px; border-radius:6px; cursor:pointer;">🌓 Tema</button>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
      </div>
    </header>

    <div class="mgmt-grid">
      <!-- Columna Izquierda: Formulario Alta / Edición -->
      <div class="panel-card">
        <h2 id="form-title" style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Nuevo Usuario</h2>
        <form id="user-crud-form">
          <input type="hidden" id="edit-index" value="-1">

          <div class="form-group">
            <label for="f-fullname">Nombre Completo</label>
            <input type="text" id="f-fullname" placeholder="Ej. Laura Gómez" required>
          </div>

          <div class="form-group">
            <label for="f-username">Usuario de Acceso</label>
            <input type="text" id="f-username" placeholder="Ej. Alumno2" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="f-password">Contraseña</label>
            <input type="text" id="f-password" placeholder="Ej. 1234" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="f-level">Rol / Nivel Jerárquico</label>
            <select id="f-level" required>
              <option value="1">Nivel 1 - Alumno</option>
              <option value="2">Nivel 2 - Maestro</option>
              <option value="3">Nivel 3 - Director</option>
            </select>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">Guardar Registro</button>
          <button type="button" id="cancel-edit-btn" class="btn-sm" style="width: 100%; margin-top: 8px; display: none;">Cancelar Edición</button>
        </form>
      </div>

      <!-- Columna Derecha: Tabla de Registros Activos -->
      <div class="panel-card" style="overflow-x: auto;">
        <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Base de Datos de Usuarios (Tabla `users`)</h2>
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Contraseña</th>
              <th>Perfil</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // 0. Tema Oscuro / Claro
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (localStorage.getItem("rbac_theme") === "light") {
      document.body.classList.add("light-theme");
    }
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      localStorage.setItem("rbac_theme", document.body.classList.contains("light-theme") ? "light" : "dark");
    });

    // 1. Guardia de Seguridad y Privilegios (Solo Nivel 3 o 4)
    const currentSession = requireAuth();
    if (currentSession.level < 3) {
      alert("Acceso denegado: Se requieren privilegios de Director.");
      window.location.href = "dashboard.html";
    }

    document.getElementById("display-name").textContent = currentSession.fullName;
    const meta = ROLE_META[currentSession.level] || { name: "Director" };
    document.getElementById("display-role").textContent = `Perfil: ${meta.name} (Nivel ${currentSession.level})`;

    // 2. Lógica CRUD sobre la tabla de usuarios
    const form         = document.getElementById("user-crud-form");
    const editIndexInp = document.getElementById("edit-index");
    const fullnameInp  = document.getElementById("f-fullname");
    const usernameInp  = document.getElementById("f-username");
    const passwordInp  = document.getElementById("f-password");
    const levelSel     = document.getElementById("f-level");
    const formTitle    = document.getElementById("form-title");
    const submitBtn    = document.getElementById("submit-btn");
    const cancelBtn    = document.getElementById("cancel-edit-btn");
    const tbody        = document.getElementById("users-table-body");

    function renderUsersTable() {
      const users = getUsersDB();
      tbody.innerHTML = "";

      users.forEach((u, index) => {
        const roleInfo = ROLE_META[u.level] || { name: "Desconocido", color: "#64748b" };
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td><strong>${u.fullName}</strong></td>
          <td>${u.user}</td>
          <td style="font-family: monospace; color: var(--text-muted);">${u.pass}</td>
          <td><span class="badge" style="background:${roleInfo.color}; color:#fff;">${roleInfo.name}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-sm" onclick="editUser(${index})">Editar</button>
              <button class="btn-sm btn-del" onclick="deleteUser(${index})">Eliminar</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Alta y Actualización (Create / Update)
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const users = getUsersDB();
      const idx = parseInt(editIndexInp.value, 10);

      const userRecord = {
        fullName: fullnameInp.value.trim(),
        user: usernameInp.value.trim(),
        pass: passwordInp.value.trim(),
        level: parseInt(levelSel.value, 10)
      };

      if (idx === -1) {
        // Verificar que no exista el mismo nombre de usuario
        if (users.some(u => u.user.toLowerCase() === userRecord.user.toLowerCase())) {
          alert("Error: Ese nombre de usuario ya está registrado.");
          return;
        }
        users.push(userRecord);
      } else {
        users[idx] = userRecord;
      }

      saveUsersDB(users);
      resetForm();
      renderUsersTable();
    });

    // Cargar datos en formulario para editar
    window.editUser = function(index) {
      const users = getUsersDB();
      const u = users[index];
      editIndexInp.value = index;
      fullnameInp.value = u.fullName;
      usernameInp.value = u.user;
      passwordInp.value = u.pass;
      levelSel.value = u.level;

      formTitle.textContent = `Editando a: ${u.user}`;
      submitBtn.textContent = "Actualizar Registro";
      cancelBtn.style.display = "block";
    };

    // Eliminar usuario (Delete)
    window.deleteUser = function(index) {
      const users = getUsersDB();
      const target = users[index];

      if (target.user === currentSession.user) {
        alert("No puedes eliminar tu propia cuenta mientras tienes la sesión activa.");
        return;
      }

      if (confirm(`¿Seguro que deseas eliminar a ${target.fullName} (${target.user})?`)) {
        users.splice(index, 1);
        saveUsersDB(users);
        renderUsersTable();
      }
    };

    function resetForm() {
      form.reset();
      editIndexInp.value = "-1";
      formTitle.textContent = "Registrar Nuevo Usuario";
      submitBtn.textContent = "Guardar Registro";
      cancelBtn.style.display = "none";
    }

    cancelBtn.addEventListener("click", resetForm);
    document.getElementById("logout-btn").addEventListener("click", logoutUser);

    // Arranque
    renderUsersTable();
  </script>
</body>
</html>
